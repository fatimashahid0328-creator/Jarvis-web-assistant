[package]
name = "jarvis-web-assistant"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
actix-rt = "2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
actix-cors = "0.7"
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1.19"
rand = "0.8"

[[bin]]
name = "jarvis_backend"
path = "src/main.rs"
